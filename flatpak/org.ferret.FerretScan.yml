app-id: org.ferret.FerretScan
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: ferret-scan

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=all
  - --filesystem=home

modules:
  - name: ferret-scan
    buildsystem: simple
    build-commands:
      - bash -c 'source /src/scripts/lib/common.sh && /src/scripts/dev-setup'
      - install -Dm755 /src/ferret /app/bin/ferret-scan
      - cp -a /src/res /app/share/ferret/
      - cp -a /src/src /app/share/ferret/
      - cp /src/scripts/ferret_gui.py /app/share/ferret/
      - cp -a /src/.venv /app/venv
      - bash -c 'source /src/scripts/lib/common.sh && install -d /app/lib/orbbec && cp -a "$(ferret_sdk_lib_dir)/"* /app/lib/orbbec/ && rm -rf /app/lib/orbbec/ferret'
      - bash -c 'source /src/scripts/lib/common.sh && ferret_install_orbbec_licenses /app/share/doc/ferret-scan/orbbec'
      - install -Dm644 /src/LICENSE /app/share/doc/ferret-scan/gpl-2.0.txt
      - install -Dm644 /src/doc/THIRD_PARTY_LICENSES.md /app/share/doc/ferret-scan/THIRD_PARTY_LICENSES.md
    sources:
      - type: dir
        path: ..
