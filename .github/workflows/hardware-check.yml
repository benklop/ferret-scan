name: Hardware check

on:
  workflow_dispatch:

jobs:
  ferret-snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v5

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwxgtk3.2-dev \
            libjpeg-dev libpng-dev libtiff-dev libsm-dev libxrender-dev \
            libxinerama-dev libxi-dev libwebkit2gtk-4.1-dev libsdl2-dev \
            libgstreamer1.0-dev libgstreamer1.0-plugins-base-dev

      - name: Dev setup
        run: ./scripts/dev-setup

      - name: License check
        run: bash scripts/check_licenses.sh

      - name: Ferret snap (requires USB device)
        run: ./scripts/dev-check --snap
