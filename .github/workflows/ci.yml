name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install native dependencies (wxPython source build)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-3-dev libwxgtk3.2-dev libjpeg-dev libpng-dev libtiff-dev \
            libsm-dev libxrender-dev libxinerama-dev libxi-dev \
            libwebkit2gtk-4.1-dev libsdl2-dev \
            libgstreamer1.0-dev libgstreamer1.0-plugins-base-dev

      - name: Install Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Dev setup
        run: ./scripts/dev-setup

      - name: License compliance
        run: bash scripts/check_licenses.sh

      - name: Ruff format
        run: uv run ruff format --check

      - name: Ruff lint
        run: uv run ruff check

      - name: Pytest (ferret-scan)
        run: .venv/bin/python -m pytest test/

      - name: Pytest (libciclops)
        run: .venv/bin/python -m pytest packages/libciclops/tests/ -q

      - name: Pytest (librevolve)
        run: .venv/bin/python -m pytest packages/librevolve/tests/ -q
