[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "libciclops"
description = "Ciclop DIY laser scanner engine (serial turntable, USB webcam, laser scan)"
readme = "README.md"
license = { text = "GPL-2.0-only" }
requires-python = ">=3.9,<3.14"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "pyserial>=3.5",
    "packaging>=23",
]
version = "0.1.0"

[tool.setuptools.packages.find]
where = ["src"]
