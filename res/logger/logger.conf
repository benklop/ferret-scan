[loggers]
keys=root,ferret

[handlers]
keys=fileHandler,consoleHandler

[formatters]
keys=ferretFormatter

[logger_root]
level=CRITICAL
handlers=consoleHandler

[logger_ferret]
level=DEBUG
handlers=fileHandler
qualname=ferret

[handler_fileHandler]
class=FileHandler
formatter=ferretFormatter
args=("ferret.log",)

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=ferretFormatter
args=(sys.stdout,)

[formatter_ferretFormatter]
#format=%(asctime)s - %(levelname)s - %(message)s
format=%(asctime)s.%(msecs)03d - %(message)s
datefmt=%Y-%m-%d %H:%M:%S
