[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ferret-scan"
description = "Structured-light 3D scanning for CR-Scan Ferret"
readme = "README.md"
license = { text = "GPL-2.0-only" }
requires-python = ">=3.9,<3.14"
# wxPython before matplotlib so the wx backend is available.
dependencies = [
    "wxPython>=4.2",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "PyOpenGL>=3.1",
    "scipy>=1.10",
    "matplotlib>=3.8",
    "packaging>=23",
]
version = "0.0.0.dev0"

[project.optional-dependencies]
diy = ["libciclops"]
revolve = ["librevolve>=0.1.0"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "nox>=2024.10",
    "pybind11>=2.10",
    "libciclops",
    "librevolve",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]
markers = [
    "needs_wx: requires a working wxPython install",
]

[tool.ruff]
target-version = "py39"
line-length = 120
exclude = [
    "libferret",
    ".deps",
    "build",
    "dist",
    "doc",
    "pkg",
    "res",
    "setup_mac.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
    "E501",  # line length (legacy)
    "F403",  # star imports (legacy, e.g. uvc/mac)
    "F405",  # undefined from star import
]

[tool.ruff.lint.per-file-ignores]
# gettext _() is injected at runtime
"src/ferret_scan/gui/**" = ["F821"]
"src/ferret_scan/util/profile.py" = ["F821", "E402"]
"src/ferret_scan/settings/**" = ["F821", "E402"]
"src/ferret_scan/engine/**" = ["E741", "E721"]

[tool.ruff.format]
quote-style = "single"

[tool.uv]
package = true
workspace = { members = [".", "packages/libciclops"] }
# Always compile wxPython against the host GTK/wxGTK stack (wheels are not portable on Linux).
no-binary-package = ["wxpython", "wxPython"]

[tool.uv.sources]
libciclops = { workspace = true }
librevolve = { path = "../librevolve", editable = true }
