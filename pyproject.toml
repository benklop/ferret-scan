[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ferret-scan"
description = "Structured-light 3D scanning for CR-Scan Ferret"
readme = "README.md"
license = { text = "GPL-2.0-only" }
requires-python = ">=3.9,<3.14"
# wxPython before matplotlib so the wx backend is available.
dependencies = [
    "wxPython>=4.2",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "PyOpenGL>=3.1",
    "pyserial>=3.5",
    "scipy>=1.10",
    "matplotlib>=3.8",
    "six>=1.16",
]
version = "0.0.0.dev0"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.9",
    "nox>=2024.10",
    "pybind11>=2.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 120
exclude = [
    "libferret",
    ".deps",
    "build",
    "dist",
    "doc",
    "pkg",
    "res",
    "setup_mac.py",
    "src/ferret/engine/driver/uvc/mac",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = [
    "E501",  # line length (legacy)
    "E722",  # bare except (legacy)
    "F403",  # star imports (legacy, e.g. uvc/mac)
    "F405",  # undefined from star import
]

[tool.ruff.lint.per-file-ignores]
# Legacy Horus/Gryphon code: gettext _(), late imports, ambiguous names.
"src/ferret/**" = ["F821", "E402", "E741", "F841", "E721", "E712", "F524"]

[tool.ruff.format]
quote-style = "single"

[tool.uv]
package = true
# Always compile wxPython against the host GTK/wxGTK stack (wheels are not portable on Linux).
no-binary-package = ["wxpython", "wxPython"]
